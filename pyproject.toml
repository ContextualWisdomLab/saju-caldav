[project]
name = "saju-caldav"
version = "0.2.0"
description = "Custom Four Pillars calendars published over CalDAV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bcrypt==5.0.0",
  "fastapi==0.140.0",
  "httpx==0.28.1",
  "icalendar==7.2.2",
  "korean-lunar-calendar==0.4.0",
  "pyjwt==2.10.1",
  "cryptography==50.0.0",
  "radicale==3.7.7",
  "tzdata==2026.3",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
  "coverage==7.15.3",
  "pytest==9.0.2",
  "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "lunar_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
exclude = ["lunar_python"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
