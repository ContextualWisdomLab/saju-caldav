name: Hourly Product Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: hourly-product-loop-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out the exact default branch without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          prune-cache: true
      - name: Install locked development environment
        run: uv sync --locked --dev
      - name: Run deterministic quality sentinel
        run: uv run python scripts/hourly_product_loop.py --format text

  nim-proposal-gate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record safe proposal gate
        env:
          GH_TOKEN: ${{ github.token }}
          NIM_CONFIGURED: ${{ secrets.NVIDIA_NIM_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1 --json number)"
          if [ "$(jq 'length' <<<"$open_prs")" -gt 0 ]; then
            echo "NIM proposal paused: an open PR already owns the review lane." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$NIM_CONFIGURED" != true ]; then
            echo "NIM proposal paused: NVIDIA_NIM_API_KEY is not configured." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat >>"$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          NIM key and zero-open-PR gate passed. A future publisher may run the
          three-runner proposal contract from ADR-0003; this workflow deliberately
          does not grant model or maintainer write credentials.
          SUMMARY
