name: Regenerate Radicale runtime lock

on:
  push:
    branches:
      - fix/radicale-runtime-lock-3.7.7

concurrency:
  group: regenerate-radicale-runtime-lock-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify regenerated lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact source head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Regenerate the deployment lock deterministically
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements.txt --output-file requirements.lock

      - name: Require the intended dependency and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'radicale==3.7.7 \' requirements.lock
          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" -ne 1 || "${changed[0]}" != "requirements.lock" ]]; then
            printf 'Unexpected regenerated paths:\n' >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi
          git diff --check

      - name: Install the exact development environment
        run: uv sync --locked --dev

      - name: Run lint and complete tests with 100 percent coverage
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check .
          uv run coverage run -m pytest -q
          uv run coverage report

      - name: Build the deployment image from the regenerated lock
        run: docker build --tag saju-caldav:radicale-lock .

  publish:
    name: Publish verified lock and remove this workflow
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.ref == 'refs/heads/fix/radicale-runtime-lock-3.7.7'
    steps:
      - name: Check out the exact publication head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: fix/radicale-runtime-lock-3.7.7
          fetch-depth: 0
          persist-credentials: true

      - name: Require an unchanged branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: false

      - name: Reproduce the verified lock without running repository code
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements.txt --output-file requirements.lock

      - name: Remove the one-shot workflow and enforce the final scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/regenerate-radicale-runtime-lock.yml
          grep -Fq 'radicale==3.7.7 \' requirements.lock
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/regenerate-radicale-runtime-lock.yml
            requirements.lock
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected publication paths:\n' >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          fi

      - name: Commit the deterministic result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.lock .github/workflows/regenerate-radicale-runtime-lock.yml
          git commit -m 'fix(deps): regenerate Radicale runtime lock'
          git push origin HEAD:fix/radicale-runtime-lock-3.7.7
